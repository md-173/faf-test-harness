# Pinned faf-ice-adapter release (FAForever/java-ice-adapter), cross-checked against
# downlords-faf-client's gradle.properties. Fetch the binary with: ./gradlew downloadIceAdapter
# See documentation/operations/ice-adapter-setup.md.
iceAdapterVersion=3.3.14
# SHA-256 of faf-ice-adapter-${iceAdapterVersion}-nojfx.jar — update together with the version.
iceAdapterSha256=5d1348f57d29e51c92e5a80380e4cf0dec85f867bdc6f58d8c4e5b5fc01d8281
# Version of the mock game and mock client. Pre-1.0 on purpose: RELEASE_BODY.md tells consumers the
# interface is likely to break between releases, and the versions actually shipped are 0.1.0 and
# 0.2.0, so a 1.0-SNAPSHOT default said the opposite of what the release notes do (WBS-7.6, #317).
# A release overrides this with -Pversion, so this value is what local builds and jar names use.
version=0.3.0-SNAPSHOT
