# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    #
    # Held at v5, not the current v6, deliberately. v6 extracted the caching this step relies on
    # into `gradle-actions-caching`, a closed-source component under Gradle's commercial Terms of
    # Use rather than the MIT licence v4 and v5 carry. v5 is Node 24, so it clears the forced
    # migration that motivated this bump without anyone here accepting new licence terms. Moving to
    # v6 is a call for the team, not a routine version bump: see
    # https://blog.gradle.org/github-actions-for-gradle-v6.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    # A failed build is torn down with the runner, so the Gradle reports die with it and all that
    # survives is the one-line assertion in the log above. Keep them on failure — the XML and HTML
    # carry the stack trace and the captured stdout/stderr that the log line does not. Green runs do
    # not match `failure()`, so they upload nothing. Caveat: `build` stops at the first module whose
    # tests fail, so the artifact holds that module plus any that finished before it, not always all
    # three. `warn` is deliberate — a compile or checkstyle failure legitimately produces no test
    # reports and must not become a second, misleading step failure.
    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          **/build/reports/tests
          **/build/test-results
        retention-days: 14
        if-no-files-found: warn

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
    #
    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
    #   with:
    #     gradle-version: '8.9'
    #
    # - name: Build with Gradle 8.9
    #   run: gradle build

  # The live tests that need no lobby and no FAF account, on every pull request (WBS-2.3.3.4, #451).
  #
  # build excludes every @Tag("integration") test. live-integration.yml runs only on dispatch,
  # because its session needs access tokens minted by hand, and is advisory, because the shared
  # lobby it logs into is outside our control. These four need neither. The adapter jar is pinned
  # and checksummed, ClientGameLifecycleLiveTest runs its own scripted lobby, and the other three
  # open no lobby connection at all. The adapter does dial FAF's telemetry server, but only after
  # its GPGNet and RPC servers start, and it drops its telemetry debugger if that connect fails
  # (3.3.14: IceAdapter.start, TelemetryDebugger.startupComplete), so an unreachable telemetry
  # server cannot fail them. No FAF account, lobby or secret decides the verdict, so the job runs
  # on every pull request, forks included.
  #
  # Treated as a gate: under CONTRIBUTING.md section 4 a pull request is ready to merge only when
  # every CI check is green, this one included. It was measured first, on #458 (2026-09-24): 30 of
  # 30 job runs passed (three rounds of ten legs), each 49 to 75 s beside build's roughly 4
  # minutes. That still allows a flake rate of up to about 9.5% on those 30 alone, or 6.7% counting
  # 13 earlier passes of live-integration.yml's live-tests (one-sided 95%), so if this job goes red
  # on two pull requests within 30 days for reasons unrelated to their change, it becomes advisory
  # (continue-on-error, and CONTRIBUTING.md section 3 says so) and the flake gets a fix card.
  #
  # The one known timing risk is the wait before the first GPGNet frame (gpgnet-format-spec.md
  # section 8.1): mock-game's own 500 ms, and GpgNetConnectionLiveSmokeTest's until #225 replaces
  # it. The measured runs had at least 477 ms of it to spare. Adapter output showing "gameState
  # must not change to null" is that race; unless the pull request changed that wait or the order
  # the client and game connect in, treat it as a flake.
  #
  # live-integration.yml runs the same four on dispatch too, so that one dispatch still covers
  # every live test CI runs, on any ref. Keep its class list and the ones below in step: a list
  # left stale after a rename fails that workflow's check.
  live-tests:

    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      # Every prerequisite this job provisions is therefore a failure when absent, not a skip.
      FAF_LIVE_REQUIRED: "true"
      # downloadIceAdapter writes the jar to the repository root. Naming it explicitly means a
      # broken download fails at the probe with the variable named, rather than resolving some
      # other jar that happens to be on a relative path.
      FAF_ICE_ADAPTER_JAR: ${{ github.workspace }}/faf-ice-adapter.jar

    steps:
    - uses: actions/checkout@v7
      timeout-minutes: 5
      with:
        # This job runs a third-party binary (the adapter jar) and needs no git credentials.
        persist-credentials: false
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      timeout-minutes: 5
      with:
        java-version: '21'
        distribution: 'temurin'

    # Held at v5 rather than v6 for the licensing reason the build job gives; keep every job on the
    # same pinned commit.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      timeout-minutes: 5

    - name: Download the pinned faf-ice-adapter jar
      run: ./gradlew downloadIceAdapter
      timeout-minutes: 5

    # --continue, so a failure in mock-client's live tests does not stop mock-game's from running:
    # without it, a red mock-client test hides whether the GPGNet handshake still works.
    - name: Run the live tests that need no lobby
      timeout-minutes: 20
      run: |
        ./gradlew --continue \
          :mock-client:integrationTest \
            --tests '*.IceSmokeLiveTest' \
            --tests '*.IceAdapterConnectionLiveSmokeTest' \
            --tests '*.ClientGameLifecycleLiveTest' \
          :mock-game:integrationTest \
            --tests '*.GpgNetConnectionLiveSmokeTest'

    # Gradle only fails a task when its whole filter matched nothing, so a renamed or moved class
    # would leave its --tests pattern matching nothing while the others still ran, and the job
    # would pass having run less than it says. FAF_LIVE_REQUIRED cannot catch that: the test it
    # would have failed in never existed. Check the JUnit XML instead. This is a copy of
    # live-integration.yml's check, so a fix to either belongs in both.
    - name: Check every expected live test ran
      if: success()
      timeout-minutes: 2
      run: |
        status=0
        check() {
          xml="$1/build/test-results/integrationTest/TEST-$2.xml"
          if [ ! -f "$xml" ]; then
            echo "::error::$2 did not run: no $xml (did the class move or get renamed?)"
            status=1
            return
          fi
          # `|| true` on each: the step runs under `bash -e`, and an assignment whose pipeline
          # ends in a grep that matches nothing would abort it, losing the message below that
          # names the offending class. The `${var:-0}` defaults then turn "no match" into a
          # reported failure instead of a bare non-zero exit.
          suite=$(grep -o '<testsuite [^>]*>' "$xml" | head -1 || true)
          tests=$(printf '%s' "$suite" | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' || true)
          skipped=$(printf '%s' "$suite" | grep -o 'skipped="[0-9]*"' | grep -o '[0-9]*' || true)
          if [ "${tests:-0}" -lt 1 ] || [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::$2 ran ${tests:-0} test(s) with ${skipped:-0} skipped; expected at least one run and none skipped"
            status=1
            return
          fi
          echo "$2: ${tests} test(s), none skipped"
        }
        check mock-client com.faforever.testharness.client.cli.IceSmokeLiveTest
        check mock-client com.faforever.testharness.client.ice.IceAdapterConnectionLiveSmokeTest
        check mock-client com.faforever.testharness.client.state.ClientGameLifecycleLiveTest
        check mock-game com.faforever.testharness.game.gpgnet.GpgNetConnectionLiveSmokeTest
        exit $status

    # Failure only, as for build: a green run has nothing to explain. The JSONL logs are what makes
    # a live failure readable (the adapter's and the game's captured output next to the client's
    # own lines), and the glob keeps rolled archives (.jsonl.<date>.<n>.gz) too, since mock-client's
    # integrationTest logs at DEBUG. Not build's test-reports-* name: artifact names are unique
    # within a run, so if both jobs failed, the second upload would be refused.
    - name: Upload test reports and JSONL logs
      if: failure()
      uses: actions/upload-artifact@v7
      timeout-minutes: 5
      with:
        name: live-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          **/build/reports/tests
          **/build/test-results
          **/logs/*.jsonl*
        retention-days: 14
        if-no-files-found: warn

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
