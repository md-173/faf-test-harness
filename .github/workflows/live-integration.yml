# Live integration checks against the FAF test environment (WBS-2.3.3.1, #364).
#
# ci.yml runs ./gradlew build, which excludes every @Tag("integration") test, so nothing there
# shows the client, adapter and game path working on a GitHub runner. This workflow does, and it is
# the shape of the job a consumer (first: the java-ice-adapter maintainer) runs in their own CI.
# Two steps differ for them, and #87's runbook section carries that variant: they download the
# mock-client and mock-game jars from releases/latest instead of building them here, and they point
# --ice-adapter-binary-path at their own adapter build instead of the version downloadIceAdapter
# pins. The session command itself is the same, kept here in scripts/ci/run-session.sh because this
# job runs it again after the passing session: once with ICE signalling delayed (WBS-5.1.1) and
# twice to prove its verdict can fail (WBS-2.3.3.3), runs a consumer's job need not copy.
#
# Advisory, never a PR gate: the shared test lobby's availability is outside our control, so a
# failure here is a finding rather than a reason to block a merge. ci.yml stays the gate.
#
# The live tests self-skip when a binary is missing, which would let a misprovisioned run go green
# having tested nothing. FAF_LIVE_REQUIRED turns each of those skips into a failure naming what is
# missing; local runs leave it unset and keep skipping.

name: Live integration (advisory)

on:
  workflow_dispatch:
    inputs:
      # The delay run's value (WBS-5.1.1): how long each client holds every relayed ICE candidate.
      # The default is CI's delay, chosen from the runner baseline in harness-runbook.md section 10;
      # another value is for measuring, not for a routine dispatch.
      ice-relay-delay-ms:
        description: "Delay run: ms each client holds a relayed ICE candidate (runbook section 10)"
        type: number
        default: 600

permissions:
  contents: read

# Fixed name, deliberately not keyed on the ref: the FAF accounts are the resource being
# serialised, not the branch. A second login as the same account signs the first out, fatally, and a
# dispatch can name any ref, so two dispatches must never overlap. Runs queue instead of cancelling,
# since cancelling a run mid-session would leave its game hosted on the lobby. GitHub keeps one
# running and one pending run per group, and a newer pending run replaces an older one.
concurrency:
  group: live-integration-accounts-c-d
  cancel-in-progress: false

jobs:
  live-tests:
    name: Live tests that need no account
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Every prerequisite this job provisions is therefore a failure when absent, not a skip.
      FAF_LIVE_REQUIRED: "true"
      # downloadIceAdapter writes the jar to the repository root. Naming it explicitly means a
      # broken download fails at the probe with the variable named, rather than resolving some
      # other jar that happens to be on a relative path.
      FAF_ICE_ADAPTER_JAR: ${{ github.workspace }}/faf-ice-adapter.jar

    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          # This job runs a third-party binary (the adapter jar) and needs no git credentials.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        timeout-minutes: 5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Held at v5 rather than v6 for the licensing reason ci.yml documents at length; keep the two
      # workflows on the same pinned commit.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        timeout-minutes: 5

      - name: Download the pinned faf-ice-adapter jar
        run: ./gradlew downloadIceAdapter
        timeout-minutes: 5

      # The four classes plus one case that need no FAF account. The credentialed live tests
      # (MultiPeerSessionLiveTest, LobbyAuthenticatorLiveTest and this class's
      # authHandshakeYieldsTerminalReply) read .secrets/refresh_token*.txt: a refresh token rotates
      # on every use, so using one here would spend a developer's local copy. connectSucceeds needs
      # no credential and is worth running: it separates "this runner cannot reach the lobby at all"
      # from a credential failure in the session job.
      - name: Run the live tests that need no account
        timeout-minutes: 20
        run: |
          ./gradlew \
            :mock-client:integrationTest \
              --tests '*.IceSmokeLiveTest' \
              --tests '*.IceAdapterConnectionLiveSmokeTest' \
              --tests '*.ClientGameLifecycleLiveTest' \
              --tests '*.LobbyConnectionLiveSmokeTest.connectSucceeds' \
            :mock-game:integrationTest \
              --tests '*.GpgNetConnectionLiveSmokeTest'

      # Gradle only fails a task when its whole filter matched nothing, so a renamed or moved class
      # would leave its --tests pattern matching nothing while the others still ran, and the job
      # would pass having run less than it says. FAF_LIVE_REQUIRED cannot catch that: the test it
      # would have failed in never existed. Check the JUnit XML instead.
      - name: Check every expected live test ran
        if: success()
        timeout-minutes: 2
        run: |
          status=0
          check() {
            xml="$1/build/test-results/integrationTest/TEST-$2.xml"
            if [ ! -f "$xml" ]; then
              echo "::error::$2 did not run: no $xml (did the class move or get renamed?)"
              status=1
              return
            fi
            # `|| true` on each: the step runs under `bash -e`, and an assignment whose pipeline
            # ends in a grep that matches nothing would abort it, losing the message below that
            # names the offending class. The `${var:-0}` defaults then turn "no match" into a
            # reported failure instead of a bare non-zero exit.
            suite=$(grep -o '<testsuite [^>]*>' "$xml" | head -1 || true)
            tests=$(printf '%s' "$suite" | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' || true)
            skipped=$(printf '%s' "$suite" | grep -o 'skipped="[0-9]*"' | grep -o '[0-9]*' || true)
            if [ "${tests:-0}" -lt 1 ] || [ "${skipped:-0}" -ne 0 ]; then
              echo "::error::$2 ran ${tests:-0} test(s) with ${skipped:-0} skipped; expected at least one run and none skipped"
              status=1
              return
            fi
            echo "$2: ${tests} test(s), none skipped"
          }
          check mock-client com.faforever.testharness.client.cli.IceSmokeLiveTest
          check mock-client com.faforever.testharness.client.ice.IceAdapterConnectionLiveSmokeTest
          check mock-client com.faforever.testharness.client.state.ClientGameLifecycleLiveTest
          check mock-client com.faforever.testharness.client.lobby.LobbyConnectionLiveSmokeTest
          check mock-game com.faforever.testharness.game.gpgnet.GpgNetConnectionLiveSmokeTest
          exit $status

      # Failure only, as in ci.yml: a green run has nothing to explain. The JSONL logs are what
      # makes a live failure readable (the adapter's and the game's captured output next to the
      # client's own lines), and the runner is destroyed with them otherwise. The glob keeps rolled
      # archives (.jsonl.<date>.<n>.gz) too, since this task logs at DEBUG. Nothing in this job
      # holds a credential: the tests it runs have no account.
      - name: Upload test reports and JSONL logs
        if: failure()
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: live-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/build/reports/tests
            **/build/test-results
            **/logs/*.jsonl*
          retention-days: 14
          if-no-files-found: warn

  # The main check, and the shape of the job the runbook gives a consumer: one host and one joiner,
  # each with its own account, adapter and game, meeting through the live lobby. It runs from the
  # release jars, as a consumer would, rather than through Gradle.
  #
  # It runs in parallel with live-tests on purpose. The two answer different questions, and a flaky
  # no-login test must not hide this verdict.
  session:
    name: Two-peer session (accounts C and D)
    runs-on: ubuntu-latest
    # Above every session step's 12-minute backstop together, with room for provisioning. A job cap
    # cancels the run rather than failing a step, so a session caught by it never reports its
    # verdict at all. A normal run takes about two and a half minutes.
    timeout-minutes: 60

    env:
      # Pinned, with the digest GitHub publishes for the release asset. faf-uid produces the
      # RSA-encrypted unique_id the lobby's policy server can decode; a placeholder makes that check
      # answer non-2xx, which fails the login.
      FAF_UID_VERSION: v4.0.7
      FAF_UID_SHA256: 1136d0e1cd7e61682ad375043fdac4bae690bf63d7fdd98a7a3a1fb9ccac61da
      # FAF_UID_BINARY and TOKENS belong here too, but both live under RUNNER_TEMP and the runner
      # context is not available in a job's env (github, needs, strategy, matrix, vars, secrets and
      # inputs are). Each is exported to GITHUB_ENV by the step that first needs it, from the
      # RUNNER_TEMP variable the runner sets in the shell.
      #
      # The passing session's working directory: its logs land in session-run/logs/, the one log the
      # evidence step reads. Each session after it gets its own directory beside this one
      # (session-delay, session-drop, session-crash), since a session appends to any log it finds
      # there.
      WORK: ${{ github.workspace }}/session-run
      # One place, because both the session command (scripts/ci/run-session.sh) and the evidence
      # check below depend on it: the evidence check expects one faf-uid line and one login per
      # peer. The job and step names say "two-peer" in prose and would need editing too.
      PEERS: "2"
      # The delay run's relay delay in milliseconds (WBS-5.1.1), from the dispatch input. Only that
      # run passes it on, as --ice-relay-delay-ms. Never give it the FAF_MOCK_CLIENT_ prefix:
      # mock-client reads every variable with that prefix as an option, which would delay every
      # session in the job.
      ICE_RELAY_DELAY_MS: ${{ inputs.ice-relay-delay-ms }}

    steps:
      # First, so a run without its secrets fails in seconds rather than after a build, and names
      # exactly which secret is missing.
      #
      # Each secret holds a pre-signed access token, minted right before a dispatch by
      # scripts/ci/mint-access-token.sh. Nothing is exchanged at runtime, which is why the session
      # step below passes no OAuth endpoint or client flag at all. Those five belonged to the
      # refresh channel: two that its exchange itself uses on every run, and three that describe
      # the one-time browser bootstrap no run performs. A pre-signed token is sent as-is.
      - name: Write the peer token files
        timeout-minutes: 1
        env:
          FAF_CI_ACCESS_TOKEN_C: ${{ secrets.FAF_CI_ACCESS_TOKEN_C }}
          FAF_CI_ACCESS_TOKEN_D: ${{ secrets.FAF_CI_ACCESS_TOKEN_D }}
        run: |
          umask 077
          # Outside the workspace, so no upload path and no checked-out directory can reach them.
          TOKENS="$RUNNER_TEMP/faf-tokens"
          echo "TOKENS=$TOKENS" >> "$GITHUB_ENV"
          mkdir -p "$TOKENS"
          missing=""
          [ -n "$FAF_CI_ACCESS_TOKEN_C" ] || missing="$missing FAF_CI_ACCESS_TOKEN_C"
          [ -n "$FAF_CI_ACCESS_TOKEN_D" ] || missing="$missing FAF_CI_ACCESS_TOKEN_D"
          if [ -n "$missing" ]; then
            echo "::error::token secret not set:$missing - mint it with scripts/ci/mint-access-token.sh, one seeded account per peer"
            exit 1
          fi
          # Then the one thing about a pre-signed token that is already knowable here. The session
          # does not log in until after the build, and a dispatch can queue behind a running one
          # before that, so a token minted before the dispatch can be dead by the time it is used.
          # Without this the run spends the whole build to report an ordinary-looking login
          # failure. Same reasoning as the faf-uid probe below, and the same shape: a prerequisite
          # this job provisions is checked before the job depends on it.
          #
          # This does not contradict StaticTokenSource, which reads no expiry on purpose so that
          # the lobby's precise rejection is never flattened into a local guess. That rule is about
          # the harness at runtime. This is CI pre-flight, it refuses only a token that cannot
          # possibly work, and every other verdict is still the lobby's. The decoder is the
          # inspector from harness-runbook.md section 3, trimmed to the single claim this needs.
          #
          # Tokens are read from the environment, never from argv, so none reaches the process
          # table. Only exp is read and only exp is printed.
          python3 - <<'PY'
          import base64, json, os, string, sys, time

          B64URL = set(string.ascii_letters + string.digits + "-_")
          # Everything between this step and the last session's login: provisioning, the Gradle
          # build, then the sessions before the last, about two minutes of them. A token with less
          # than this left may not survive to be used, so say so while there is still time to mint
          # another.
          WARN_BELOW = 15 * 60


          # An exp that is present but not a number is not a verdict in doubt: the lobby's PyJWT
          # raises on it rather than weighing it, so such a token is always rejected. Kept apart
          # from "cannot read one", where the lobby may well accept.
          MALFORMED = object()


          def expiry_of(token):
              """The token's exp as (seconds, formatted), None if none can be read, or MALFORMED
              if the claim is there but is not a number."""
              parts = token.strip().split(".")
              if len(parts) != 3:
                  return None
              segment = parts[1]
              if not segment or set(segment) - B64URL or len(segment) % 4 == 1:
                  return None
              try:
                  claims = json.loads(
                      base64.urlsafe_b64decode(segment + "=" * (-len(segment) % 4)))
              except ValueError:
                  return None
              if not isinstance(claims, dict):
                  return None
              if "exp" not in claims:
                  # The lobby accepts a token carrying no exp at all, so this is not a fault.
                  return None
              exp = claims["exp"]
              # bool is an int subclass and json turns `true` into one; it is not an expiry.
              # A float is: RFC 7519 lets NumericDate be non-integer, and the lobby casts it.
              if isinstance(exp, bool) or not isinstance(exp, (int, float)):
                  return MALFORMED
              try:
                  return exp, time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(exp))
              except (OverflowError, OSError, ValueError):
                  # A number the lobby would still compare, but not one this platform can express
                  # as a time. Leave it to the lobby rather than report a nonsense span.
                  return None


          def span(seconds):
              if seconds < 60:
                  return "less than a minute"
              minutes = int(seconds // 60)
              return "1 minute" if minutes == 1 else "%d minutes" % minutes


          now = time.time()
          expired = []
          # Both are checked before either can end the run, so one dispatch reports both faults.
          for name in ("FAF_CI_ACCESS_TOKEN_C", "FAF_CI_ACCESS_TOKEN_D"):
              found = expiry_of(os.environ.get(name, ""))
              if found is MALFORMED:
                  print("::warning::%s has an exp claim that is not a number, which the lobby "
                        "rejects outright; mint a fresh one before dispatching again" % name)
                  continue
              if found is None:
                  # An opaque token carries no readable claims and may still be valid, so the
                  # lobby decides. Being stricter here than the thing being pre-flighted is how a
                  # pre-flight starts failing good runs.
                  print("::warning::%s carries no usable exp claim; it is sent unchecked "
                        "and the lobby decides" % name)
                  continue
              exp, when = found
              left = exp - now
              if left <= 0:
                  print("::error::%s expired %s ago, at %s; mint a fresh one with "
                        "scripts/ci/mint-access-token.sh and dispatch again"
                        % (name, span(-left), when))
                  expired.append(name)
              elif left < WARN_BELOW:
                  print("::warning::%s has %s left (expires %s); the session logs in after the "
                        "build, so it may expire mid-run" % (name, span(left), when))
              else:
                  print("%s is valid for %s (expires %s)" % (name, span(left), when))
          if expired:
              sys.exit(1)
          PY

          printf '%s' "$FAF_CI_ACCESS_TOKEN_C" > "$TOKENS/c.txt"
          printf '%s' "$FAF_CI_ACCESS_TOKEN_D" > "$TOKENS/d.txt"
          echo "wrote one token file per peer, owner-readable only"

      # The delay run's value comes from the dispatch form, so it is checked before anything
      # depends on it: a whole number of milliseconds from 1 to 99999. Zero would make that run's
      # leg check vacuous, and a number past int's range would fail only after the build and the
      # passing session, as a usage error. The value is quoted when refused, never echoed raw.
      - name: Check the dispatch input
        timeout-minutes: 1
        run: |
          if [[ ! "$ICE_RELAY_DELAY_MS" =~ ^[1-9][0-9]{0,4}$ ]]; then
            echo "::error::the ice-relay-delay-ms input must be a whole number of milliseconds from 1 to 99999"
            printf 'got: %q\n' "$ICE_RELAY_DELAY_MS"
            exit 1
          fi
          # A leg with one hold is the delay plus a lobby crossing of about 250 ms on a runner, so
          # below about 300 ms a peer that missed the flag would still clear twice the delay.
          if [ "$ICE_RELAY_DELAY_MS" -lt 300 ]; then
            echo "::warning::ice-relay-delay-ms is $ICE_RELAY_DELAY_MS; below about 300 ms the delay run cannot tell a peer that missed the flag from one that held its candidates"
          fi
          echo "the delay run holds each relayed ICE candidate for $ICE_RELAY_DELAY_MS ms at each client"

      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          # This job runs third-party binaries (faf-uid and the adapter jar) and needs no git
          # credentials.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        timeout-minutes: 5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        timeout-minutes: 5

      - name: Download the pinned faf-ice-adapter jar
        run: ./gradlew downloadIceAdapter
        timeout-minutes: 5

      - name: Download and verify faf-uid
        timeout-minutes: 3
        run: |
          FAF_UID_BINARY="$RUNNER_TEMP/bin/faf-uid"
          echo "FAF_UID_BINARY=$FAF_UID_BINARY" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$FAF_UID_BINARY")"
          curl -fsSL --retry 3 --retry-all-errors -o "$FAF_UID_BINARY" \
            "https://github.com/FAForever/uid/releases/download/${FAF_UID_VERSION}/faf-uid"
          echo "${FAF_UID_SHA256}  ${FAF_UID_BINARY}" | sha256sum -c -
          chmod +x "$FAF_UID_BINARY"

      # faf-uid reads DMI, BIOS and CPU details, which a cloud VM may withhold. When the
      # binary fails, the client exits with a non-zero error since a login would fail when the
      # lobby's policy POST is not 2xx, which is what a placeholder or broken uid causes (the policy
      # verdict itself is ignored at login, `ignore_result=True`). This probe makes sure the faf-uid
      # works before running the entire session. Its output is the machine's identity blob and is
      # never printed; only its length is.
      - name: Check faf-uid runs on this runner
        timeout-minutes: 2
        run: |
          set +e
          uid=$("$FAF_UID_BINARY" 1 2>"$RUNNER_TEMP/faf-uid.stderr")
          code=$?
          set -e
          if [ "$code" -ne 0 ] || [ -z "$uid" ]; then
            echo "::error::faf-uid exited $code with ${#uid} chars of output; the client aborts the handshake before it sends auth when faf-uid fails, so every login in this session would fail"
            head -c 200 "$RUNNER_TEMP/faf-uid.stderr"
            exit 1
          fi
          echo "faf-uid $FAF_UID_VERSION produced a ${#uid}-character unique_id"

      - name: Build the release jars
        run: ./gradlew :mock-client:shadowJar :mock-game:shadowJar
        timeout-minutes: 10

      # The session's own deadline is 420 s, plus at most 140 s of teardown, so this step's timeout
      # is a backstop rather than the bound that matters. A failed checkpoint exits 70 having logged
      # `session: FAIL <peer>: <stage>: <detail>`. Raise the 12 minutes if --peers grows or that
      # deadline moves: #87 defers whether the deadline scales with the peer count, and this step
      # would start cutting runs short before the session could report its own verdict. The
      # command is scripts/ci/run-session.sh, which every later session runs too, and the steps
      # after the evidence step read this one's outcome by its id.
      - name: Run a two-peer session through the live lobby
        id: session
        timeout-minutes: 12
        run: scripts/ci/run-session.sh "$WORK"

      # Uploads are failure-only, so a passing run would otherwise leave its evidence only in this
      # log. The policy answer (#365 Q1) is exactly what a passing run has to record: that faf-uid
      # produced a unique_id and that each account reached `welcome`. Account logins and the verdict
      # line hold no credential.
      - name: Record the login and session evidence
        if: always()
        timeout-minutes: 2
        run: |
          log="$WORK/logs/mockclient.jsonl"
          peers="$PEERS"
          uids=0
          logins=0
          verdicts=0
          auths=0
          # Counted first, then used to decide what the summary says. A missing line is itself the
          # finding, so it has to be stated rather than left as a blank: the counts are what make
          # that possible, since the step's shell has no pipefail and a grep that matches nothing
          # inside a pipeline cannot be detected from the pipeline's exit status.
          if [ -f "$log" ]; then
            uids=$(grep -c 'generated unique_id via faf-uid' "$log" || true)
            logins=$(grep -o 'lobby authenticated as login=[A-Za-z0-9_.-]*' "$log" | sort -u | wc -l)
            verdicts=$(grep -cE 'session: (PASS|FAIL)' "$log" || true)
            # The lobby's own rejection, which no other pattern here matches. It is the shape a
            # token that expired mid-run takes, and the pre-flight deliberately does not refuse
            # that case, so this is where it has to be readable. The text is the lobby's ("Token
            # signature was invalid", "Cannot find user id"); it never carries the token.
            auths=$(grep -c 'lobby authentication_failed' "$log" || true)
          fi
          {
            echo "### Two-peer session on a runner"
            echo
            if [ ! -f "$log" ]; then
              echo "No client log at $log, so the session never started."
            else
              echo '```text'
              if [ "$uids" -gt 0 ]; then
                grep -o 'generated unique_id via faf-uid ([0-9]* chars)' "$log" | sort | uniq -c
              else
                echo '(no faf-uid line: every peer failed to produce a uid)'
              fi
              if [ "$logins" -gt 0 ]; then
                grep -o 'lobby authenticated as login=[A-Za-z0-9_.-]*' "$log" | sort -u
              else
                echo '(no lobby authentication line: no peer reached welcome)'
              fi
              # Only when there is one: a passing run has no rejection to show. `[^"]*` stops at
              # the JSON string's closing quote, as the verdict pattern below does, so the
              # summary gets the lobby's text rather than the rest of the log record.
              if [ "$auths" -gt 0 ]; then
                grep -oE 'lobby authentication_failed: [^"]*' "$log" | sort -u | sed -n '1,4p'
              fi
              if [ "$verdicts" -gt 0 ]; then
                grep -oE 'session: (PASS|FAIL)[^"]*' "$log" | sed -n '1,5p'
              else
                echo '(no session verdict line: the run ended before the session could report)'
              fi
              # The passing session's ICE timing at zero delay (WBS-5.1.1): the runner baseline
              # harness-runbook.md section 10 records, reported and never failed on. A restarted
              # run is no sample of it, and its line says so and names the likely cause.
              python3 scripts/ci/ice-timing.py "$log" --peers "$peers" \
                || echo '(no ICE timing: scripts/ci/ice-timing.py failed)'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # The policy answer (#365 Q1) is only recorded if every peer really produced a faf-uid
          # blob and reached `welcome`. LobbyHandshake throws when faf-uid fails which
          # will fail the session. However, a misconfigured faf-uid (e.g. a binary that
          # returns a static uid) might cause the run to still pass while proving
          # nothing about faf-uid, due to the lobby ignoring the policy verdict.
          #  Warn rather than fail: the session's own verdict decides the job.
          if [ "${uids:-0}" -lt "$peers" ] || [ "${logins:-0}" -lt "$peers" ]; then
            echo "::warning::expected $peers faf-uid lines and $peers distinct logins, saw ${uids:-0} and ${logins:-0}; this run does not answer the policy question"
          fi

      # Three more sessions follow on the same accounts, each in its own directory, since a session
      # appends to any log it finds and the evidence step reads only the passing run's. Each needs
      # the passing session to have passed, since a lobby that failed it says nothing about these
      # runs, but not the other runs: one red run must not hide the rest.
      #
      # First, ICE signalling delayed inside the ceiling (WBS-5.1.1, #366). Every peer takes the
      # root flag, so the offer and the answer each wait in both clients' relays, and the adapter's
      # 6000 ms offerer timer restarts ICE if the answer has not come back by then. The run must
      # pass, each ICE leg must be at least twice the delay, and the offerer must not restart ICE:
      # exit 0 alone cannot show a restart, since the adapter's retry can still connect inside the
      # mesh budget. scripts/ci/ice-timing.py reads the legs, and harness-runbook.md section 10 has
      # the arithmetic and the runner baseline CI's delay was chosen from.
      - name: Run a session with ICE signalling delayed inside the ceiling
        if: ${{ !cancelled() && steps.session.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          dir="$GITHUB_WORKSPACE/session-delay"
          code=0
          scripts/ci/run-session.sh "$dir" --ice-relay-delay-ms="$ICE_RELAY_DELAY_MS" || code=$?
          log="$dir/logs/mockclient.jsonl"
          verdict=$(grep -oE 'session: (PASS|FAIL)[^"]*' "$log" 2>/dev/null | head -1)
          timing_code=0
          timing=$(python3 scripts/ci/ice-timing.py "$log" --peers "$PEERS" \
            --expect-delay-ms "$ICE_RELAY_DELAY_MS") || timing_code=$?
          echo "$timing"
          {
            echo "### ICE signalling delayed $ICE_RELAY_DELAY_MS ms at each client"
            echo
            echo '```text'
            echo "${verdict:-(no session verdict line)}"
            echo "$timing"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 0 ] && [[ "$verdict" == "session: PASS"* ]] && [ "$timing_code" -eq 0 ]; then
            echo "passed inside the ceiling, with every relay holding its candidates"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            reason="it exited $code: ${verdict:-no verdict line}"
          elif [[ "$verdict" != "session: PASS"* ]]; then
            reason="it exited 0 without a session: PASS line"
          else
            reason="the session passed, but its ICE timing check failed; the lines above say why"
          fi
          auth=$(grep -oE 'lobby authentication_failed: [^"]*' "$log" 2>/dev/null | head -1)
          echo "::error::delayed-ICE run: $reason${auth:+; the lobby said: $auth}"
          exit 1

      # The last two prove the verdict can fail (WBS-2.3.3.3, #431). A green run above shows the
      # happy path and nothing else, and a verdict that stopped failing would stay green until a
      # consumer noticed. `session` exits 70 for every failed checkpoint and for an exception that
      # escaped it, so each step pins the line its failure must log, not just the code, and refuses
      # a `session: FAIL teardown:` line, which a leaked process adds to any failure. Game output
      # only ever explains a red run here, never passes one: the client relays it from the game's
      # pipes, and relayed lines have gone missing before (#449).
      #
      # Every datagram dropped. The adapters still connect, because a link's liveness is the
      # offering adapter's own echo rather than game traffic (PeerConnectivityCheckerModule,
      # adapter 3.3.14), so the session must fail at the traffic checkpoint and nowhere earlier.
      - name: Prove a session with every datagram dropped fails at traffic
        if: ${{ !cancelled() && steps.session.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          dir="$GITHUB_WORKSPACE/session-drop"
          code=0
          scripts/ci/run-session.sh "$dir" --mock-game-udp-drop-percent=100 || code=$?
          log="$dir/logs/mockclient.jsonl"
          # `[^"]*` stops at the JSON string's closing quote, as in the evidence step.
          verdict=$(grep -oE 'session: (PASS|FAIL)[^"]*' "$log" 2>/dev/null | head -1)
          if [ "$code" -eq 70 ] \
            && grep -qE 'session: FAIL [^"]*: traffic: no two-way game traffic within' "$log" \
            && ! grep -q 'session: FAIL teardown:' "$log"; then
            echo "failed at the traffic checkpoint, as it must: $verdict"
            {
              echo "### Every datagram dropped: failed at traffic, as it must"
              echo
              echo '```text'
              echo "$verdict"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            if grep -q 'dropping 100%' "$log"; then
              reason="the session passed with every datagram dropped, so the traffic verdict no longer fails"
            else
              reason="the session passed, and no game logged 'dropping 100%', so the drop may never have reached the games"
            fi
          elif [ "$code" -ne 70 ]; then
            reason="it exited $code, and only 70 means a checkpoint failed"
          elif grep -q 'session: FAIL teardown:' "$log"; then
            reason="a process outlived its teardown"
          else
            reason="it failed, but not on the traffic deadline: ${verdict:-no verdict line}"
          fi
          # A token that lapsed after the pre-flight is the likeliest cause of an early failure,
          # and only this session's own log shows the lobby's rejection.
          auth=$(grep -oE 'lobby authentication_failed: [^"]*' "$log" 2>/dev/null | head -1)
          echo "::error::every-datagram-dropped run: $reason${auth:+; the lobby said: $auth}"
          exit 1

      # Both games crash as soon as they have a peer: --mock-game-crash-after-seconds=0 arms on the
      # host's first ConnectToPeer and the joiner's JoinGame and fires at once, while a later value
      # can land after the traffic checkpoint, and the session then passes. Which checkpoint
      # reports it depends on timing (full mesh when run by hand), so the stage is not pinned, and
      # the step needs a pair of lines instead. `session ended (TERMINATED) before` is what every
      # checkpoint says of a peer whose session ended, a lobby drop included; exit code 134 is
      # 128 + SIGABRT, which mock-game gives only its injected crash, though a real JVM abort exits
      # with it too. Only together do they say the crash failed the session.
      - name: Prove a session whose games crash fails
        if: ${{ !cancelled() && steps.session.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          dir="$GITHUB_WORKSPACE/session-crash"
          code=0
          scripts/ci/run-session.sh "$dir" --mock-game-crash-after-seconds=0 || code=$?
          log="$dir/logs/mockclient.jsonl"
          verdict=$(grep -oE 'session: (PASS|FAIL)[^"]*' "$log" 2>/dev/null | head -1)
          if [ "$code" -eq 70 ] \
            && grep -qE 'session: FAIL [^"]*session ended \(TERMINATED\) before' "$log" \
            && grep -q 'mock-game exited abnormally with exit code 134' "$log" \
            && ! grep -q 'session: FAIL teardown:' "$log"; then
            echo "failed on the crashed games, as it must: $verdict"
            {
              echo "### Games crashed: failed on the crash, as it must"
              echo
              echo '```text'
              echo "$verdict"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            if grep -q 'injected crash armed' "$log"; then
              reason="the session passed although a game armed its crash, so the verdict no longer fails when a game dies"
            else
              reason="the session passed, and no game logged 'injected crash armed', so the crash may never have happened"
            fi
          elif [ "$code" -ne 70 ]; then
            reason="it exited $code, and only 70 means a checkpoint failed"
          elif grep -q 'session: FAIL teardown:' "$log"; then
            reason="a process outlived its teardown"
          elif ! grep -q 'mock-game exited abnormally with exit code 134' "$log"; then
            reason="no game exited 134, so it failed for another reason: ${verdict:-no verdict line}"
          else
            reason="a game crashed, but the verdict did not name a peer whose session ended: ${verdict:-no verdict line}"
          fi
          auth=$(grep -oE 'lobby authentication_failed: [^"]*' "$log" 2>/dev/null | head -1)
          echo "::error::crashed-games run: $reason${auth:+; the lobby said: $auth}"
          exit 1

      # After the last session, on every path including a step timeout. The session rewrites
      # nothing on this channel, so each file still holds the token it was given: a bearer token
      # good until the expiry the first step printed, and a live credential for as long as that
      # lasts. It never outlives the last step that used it.
      - name: Remove the token files
        if: always()
        timeout-minutes: 1
        # The fallback matters: TOKENS is exported by the first step, so a job cancelled before it
        # would otherwise run `rm -rf ""`, which succeeds without removing anything and looks
        # identical to a real cleanup.
        run: rm -rf "${TOKENS:-$RUNNER_TEMP/faf-tokens}"

      # The last of #431's criteria, checked from outside the harness: each session sweeps its own
      # JVM's descendants and fails on a survivor, but a process that left that tree would be
      # invisible to every later sweep. The pattern matches a JVM by the jar it runs (the
      # launchers start both subprocesses as `java ... -jar <jar>`), so a client that never exited
      # is caught too, and a process that merely names one of these paths is not.
      - name: Check no adapter or game outlived the sessions
        if: always()
        timeout-minutes: 1
        run: |
          if survivors=$(pgrep -af -- '-jar [^ ]*(faf-ice-adapter\.jar|mock-(game|client)-[^ ]*-all\.jar)'); then
            echo "::error::these outlived every session's teardown:"
            printf '%s\n' "$survivors"
            exit 1
          fi
          echo "no adapter, game or client process is left"

      # Only the session's own JSONL logs: the client's lines with every adapter's and game's
      # captured output, plus each game's own file. The token files are under RUNNER_TEMP and are
      # deleted above, so no path here can reach them.
      - name: Upload the session logs
        if: failure()
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: session-logs-${{ github.run_id }}-${{ github.run_attempt }}
          # Every session's directory. With more than one path the artifact keeps each run's logs
          # under its own directory rather than at the artifact's root.
          path: |
            session-run/logs/*.jsonl*
            session-delay/logs/*.jsonl*
            session-drop/logs/*.jsonl*
            session-crash/logs/*.jsonl*
          retention-days: 14
          if-no-files-found: warn
