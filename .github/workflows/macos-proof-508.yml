# Scratch, never merged (#508): proves the reaper on macOS, which CI does not run. Lives only on
# the scratch/508-macos-proof branch; delete the branch once the run has been read.
name: macOS proof for #508 (scratch)

on:
  push:
    branches: [ "scratch/508-macos-proof" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
      with:
        # run.sh builds main's jars from the commit this branch was cut from.
        fetch-depth: 0
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
    - name: Reaper tests and kill runs, main against the branch
      run: scripts/scratch/508/run.sh
    - name: Upload the evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: macos-proof-508-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          scratch-508/
          !scratch-508/base-src/
          shared/build/test-results/test/
        retention-days: 14
        if-no-files-found: warn
