# Workflow used for releases.
# Must be manually triggered, given a version number as input, and generates a set of shadow jar files.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
      # GitHub's GET /releases/latest returns "the most recent non-prerelease, non-draft release",
      # so a release marked prerelease is invisible to it — and pulling the jar from that endpoint
      # is the route our first consumer named. It was hardcoded true, which made every release
      # invisible to them; 0.2.0 was fixed by unticking the flag by hand (WBS-7.6, #317).
      prerelease:
        description: 'Mark as a pre-release (hides it from the releases/latest API)'
        required: false
        type: boolean
        default: false

jobs:
  release:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Read once into the environment rather than interpolating the dispatch input into each `run:`
    # script. The input is free text from whoever triggers the workflow, and this job can write
    # releases and tags, so it should reach the shell as data and never as script text.
    env:
      VERSION: ${{ github.event.inputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          # The verification step below runs the whole test suite in this job, and this job's
          # GITHUB_TOKEN can write releases and tags. Left persisted, that token sits in the git
          # config where any test or test dependency could read it. release-action authenticates
          # through its own token input, not the git credential, so nothing here needs it.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # A release is dispatched against an arbitrary commit, so nothing guarantees ci.yml ever ran
      # green on it: a release cut between a bad merge and its CI run used to ship unverified jars
      # (#375). This applies the verification ci.yml applies to every pull request (`check` is the
      # verification half of ci's `build`) at the moment it decides what ships. A failing step ends
      # the job, so the checksum and release steps below never run and no draft or asset appears.
      # FAForever does the same upstream: downlords-faf-client runs `check` before building its
      # release media, and java-ice-adapter, which this workflow is modelled on, runs its checks
      # before the shadowJar steps.
      #
      # `check`, not `build`: `build` is `assemble` plus `check`, and the two steps below already do
      # the assembling with this same -Pversion, so `check` is that verification without a duplicate
      # jar build. It also keeps this step incapable of leaving a differently versioned jar in
      # build/libs, which is what a gate that lost its -Pversion would do: the default version is a
      # SNAPSHOT, and `mock-client-<default>-all.jar` matches the release globs below just as well as
      # the real one. Passing -Pversion additionally makes verifyReleaseAssetName compare against the
      # version being released (WBS-7.6, #386), which no local build covers.
      - name: Verify the commit being released
        run: ./gradlew -Pversion="$VERSION" --stacktrace check

      # The runner is torn down with the job, so a failed gate would otherwise leave only the
      # one-line assertion in the log. Same reasoning, and the same caveats, as ci.yml's copy.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/build/reports/tests
            **/build/test-results
          retention-days: 14
          if-no-files-found: warn

      - name: Create mock client shadow jars
        run: ./gradlew -Pversion="$VERSION" --stacktrace :mock-client:shadowJar

      - name: Create mock game shadow jars
        run: ./gradlew -Pversion="$VERSION" --stacktrace :mock-game:shadowJar

      # Both jars read their --version out of their own manifest, which is written from
      # project.version, so -Pversion above is what they report (WBS-3.1.5.2, #383). This is the
      # only check that ever sees a real release version: the jar tests in CI run against the
      # development default in gradle.properties. Before that manifest existed, 0.2.0 shipped
      # reporting "mock-client 1.0-SNAPSHOT", which is the string a consumer records in CI to say
      # which build they ran.
      - name: Verify each jar reports the released version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          for name in mock-client mock-game; do
            reported=$(java -jar "${name}/build/libs/${name}-${VERSION}-all.jar" --version)
            echo "${name} reports: ${reported}"
            if [ "${reported}" != "${name} ${VERSION}" ]; then
              echo "::error::${name} reports '${reported}', expected '${name} ${VERSION}'"
              exit 1
            fi
          done

      # An integrity check for the consumer, not a reproducibility one: they pull the *latest*
      # release rather than pinning a version, and a checksum cannot be pinned to a moving target.
      # Written beside each jar so the release-action glob picks them up.
      - name: Write checksums beside each jar
        run: |
          for jar in mock-client/build/libs/mock-client-*-all.jar mock-game/build/libs/mock-game-*-all.jar; do
            # Run in the jar's own directory so the file records a bare name: that is what
            # `sha256sum -c mock-game-<version>-all.jar.sha256` expects beside a downloaded jar.
            ( cd "$(dirname "$jar")" && sha256sum "$(basename "$jar")" > "$(basename "$jar").sha256" )
            cat "$jar.sha256"
          done

      - name: Create draft release
        id: create_release
        # Pinned by commit SHA, not the moving v1 tag: this job holds contents: write, so whoever can
        # move the tag could run code here that writes releases and tags (#387). Third-party actions
        # are pinned this way and GitHub's own actions/* float on majors; see CONTRIBUTING.md § 8.
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          commit: ${{ github.sha }}
          tag: ${{ github.event.inputs.version }}
          # Kept: a draft is a useful safety net for checking the jar names and testing the
          # artifacts before anything is public. Unlike prerelease, it does not hide a *published*
          # release from the API.
          #
          # Note the consequence, because it is the whole point of this card: `GET /releases/latest`
          # skips drafts as well as prereleases, so a release is invisible to a consumer following
          # that route until a human opens the draft and clicks Publish. That publish is the last
          # step of every release, not an optional one — between this workflow finishing and that
          # click, `releases/latest` still returns the previous release, which is exactly the
          # failure this card exists to kill, moved one step later.
          draft: true
          prerelease: ${{ github.event.inputs.prerelease }}
          generateReleaseNotes: true
          bodyFile: ".github/RELEASE_BODY.md"
          artifacts: "mock-game/build/libs/mock-game-*-all.jar,mock-game/build/libs/mock-game-*-all.jar.sha256,mock-client/build/libs/mock-client-*-all.jar,mock-client/build/libs/mock-client-*-all.jar.sha256"

