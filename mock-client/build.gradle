plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id('com.diffplug.spotless') version '8.4.0'
}

group = 'com.faforever.testharness'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':shared')
    implementation 'info.picocli:picocli:4.7.6'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.java-websocket:Java-WebSocket:1.5.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs JUnit tests tagged "integration" (hits live FAF .xyz endpoints).'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
}

tasks.withType(Checkstyle).configureEach {
    ignoreFailures = false
}

application {
    mainClass = 'com.faforever.testharness.client.Main'
}

tasks.register('runSubprocessExample', JavaExec) {
    group = 'application'
    description = 'Runs the SubprocessManager API example.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.faforever.testharness.client.examples.SubprocessManagerExample'
}

spotless {
    java {
        // Use Google AOSP formatting
        googleJavaFormat().aosp()
        formatAnnotations()
    }
}
