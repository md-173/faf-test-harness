apply plugin: 'java'
apply plugin: 'application'
apply plugin: 'checkstyle'
apply plugin: 'com.diffplug.spotless'
apply plugin: 'com.gradleup.shadow'

group = 'com.faforever.testharness'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':shared')
    implementation 'info.picocli:picocli:4.7.6'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.java-websocket:Java-WebSocket:1.5.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs JUnit tests tagged "integration" (hits live FAF .xyz endpoints, and ' +
            'launches the real faf-ice-adapter and mock-game binaries).'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
    // ClientGameLifecycleLiveTest (WBS-3.1.2.7) launches the *installed* mock-game distribution,
    // which is what MockGameLauncher's default --mock-game-binary-path points at. Building it here
    // makes a repeat run one command, and stops a stale dist from silently testing old game code.
    // The adapter jar is deliberately NOT wired in: downloadIceAdapter hits the network, so it
    // stays explicit (see documentation/operations/ice-adapter-setup.md) and the live tests
    // self-skip without it.
    dependsOn ':mock-game:installDist'
    // Live tests exist to show what the real binaries do, so the captured [ICEAdapter] and
    // [MockGame] subprocess output is part of the deliverable, not noise to bury in the HTML
    // report. Mirrors :mock-game:integrationTest.
    testLogging {
        showStandardStreams = true
    }
}

tasks.withType(Checkstyle).configureEach {
    ignoreFailures = false
}

application {
    mainClass = 'com.faforever.testharness.client.Main'
}

// The example lives in src/test so it documents the SubprocessManager API without shipping in
// the release shadow jar; a consumer of mock-client-*.jar has no use for demo classes.
tasks.register('runSubprocessExample', JavaExec) {
    group = 'application'
    description = 'Runs the SubprocessManager API example.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.faforever.testharness.client.examples.SubprocessManagerExample'
}

spotless {
    java {
        // Use Google AOSP formatting
        googleJavaFormat().aosp()
        formatAnnotations()
    }
}
