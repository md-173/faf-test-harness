apply plugin: 'java'
apply plugin: 'application'
apply plugin: 'checkstyle'
apply plugin: 'com.diffplug.spotless'
apply plugin: 'com.gradleup.shadow'

group = 'com.faforever.testharness'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':shared')
    implementation 'info.picocli:picocli:4.7.6'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.java-websocket:Java-WebSocket:1.5.7'
    // Test only, never in the release jar: TrafficEvidenceTest feeds TrafficEvidence a line
    // formatted by mock-game's own GameTrafficSession.progressLine, so the session verdict's parser
    // cannot drift from what the game logs (WBS-4.2.1).
    testImplementation project(':mock-game')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    // #261/#268: three lobby tests have timed out waiting for a frame and each was re-run green
    // with nothing captured. LobbyConnection already logs every inbound frame with a timestamp,
    // and ScriptedWebSocketServer now logs every frame it sends and receives, but both are at
    // DEBUG and logback.xml defaults to INFO — so today the suite throws away exactly the
    // evidence that would say whether a frame was late or never sent. Turning the level up here
    // puts both ends of every exchange in the Gradle test report, which CI uploads on failure
    // (see CONTRIBUTING.md § 3). Those lines traced the timeout in #415 to the scripted server
    // stranding a frame, since fixed, and the fixture's re-arm line, the sign the race fired
    // again, is DEBUG as well. LOG_LEVEL is read by logback.xml at config-parse time; the child
    // JVMs in LogLevelFlagEndToEndTest scrub it from their environment, so the tests that assert
    // on the default level are unaffected.
    environment 'LOG_LEVEL', 'DEBUG'
    // VersionFlagJarTest runs the shadow jar that ships, because no test from class directories can
    // see a manifest (WBS-3.1.5.2, #383). inputs.files on the task provider builds the jar first and
    // reruns the test when it changes. The path goes through an argument provider because Gradle
    // passes a Provider given to systemProperty as its toString(), not its value.
    def shadowJarFile = tasks.named('shadowJar').flatMap { it.archiveFile }
    inputs.files(tasks.named('shadowJar')).withPropertyName('shadowJarUnderTest')
    jvmArgumentProviders.add({
        ["-Dtestharness.shadowJar=${shadowJarFile.get().asFile.absolutePath}".toString()]
    } as CommandLineArgumentProvider)
    systemProperty 'testharness.version', project.version
}

tasks.register('integrationTest', Test) {
    description = 'Runs JUnit tests tagged "integration" (hits live FAF .xyz endpoints, and ' +
            'launches the real faf-ice-adapter and mock-game binaries).'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
    // ClientGameLifecycleLiveTest (WBS-3.1.2.7) launches the *installed* mock-game distribution,
    // which is what MockGameLauncher's default --mock-game-binary-path points at. Building it here
    // makes a repeat run one command, and stops a stale dist from silently testing old game code.
    // The adapter jar is deliberately NOT wired in: downloadIceAdapter hits the network, so it
    // stays explicit (see documentation/operations/ice-adapter-setup.md) and the live tests
    // self-skip without it.
    dependsOn ':mock-game:installDist'
    // Live tests exist to show what the real binaries do, so the captured [ICEAdapter] and
    // [MockGame] subprocess output is part of the deliverable, not noise to bury in the HTML
    // report. Mirrors :mock-game:integrationTest.
    testLogging {
        showStandardStreams = true
    }
    // Same reasoning as the `test` task above, and for the same cards: ClientGameLifecycleLiveTest
    // drives ScriptedWebSocketServer over the live lobby path, so it is exactly where a lost frame
    // would be hardest to reconstruct afterwards. Leaving this at INFO would have the integration
    // task showing subprocess output on the grounds that evidence is the deliverable, while
    // discarding the lobby evidence next to it.
    environment 'LOG_LEVEL', 'DEBUG'
}

tasks.withType(Checkstyle).configureEach {
    ignoreFailures = false
}

application {
    mainClass = 'com.faforever.testharness.client.Main'
}

// VersionProvider reads Implementation-Version back for --version (WBS-3.1.5.2, #383). It is
// written from project.version, which release.yml's -Pversion sets, so a release reports the
// version it was cut as. Shadow inherits this manifest, so the -all jar that ships carries it too.
// Implementation-Title is the conventional companion; the lookup does not depend on it.
jar {
    manifest {
        attributes('Implementation-Title': project.name, 'Implementation-Version': project.version)
    }
}

// The example lives in src/test so it documents the SubprocessManager API without shipping in
// the release shadow jar; a consumer of mock-client-*.jar has no use for demo classes.
tasks.register('runSubprocessExample', JavaExec) {
    group = 'application'
    description = 'Runs the SubprocessManager API example.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.faforever.testharness.client.examples.SubprocessManagerExample'
}

spotless {
    java {
        // Use Google AOSP formatting
        googleJavaFormat().aosp()
        formatAnnotations()
    }
}
