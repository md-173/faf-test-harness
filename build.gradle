// The root project holds no sources: it configures the subprojects and owns the adapter-provisioning
// task below. It therefore applies nothing (WBS-7.6, #317). Applying java/java-library/application/
// checkstyle to a source-less root produced an empty distribution and an empty root shadow jar on
// every build, and put a `run` task on the root that fails if anyone invokes it; `java` was
// redundant with `java-library` besides. The core plugins are simply gone — every subproject
// applies what it needs. The two third-party ones stay to pin their versions for the subprojects
// that do apply them, with `apply false` so the root does not (a core plugin cannot take that
// option: Gradle rejects it as a no-op).
plugins {
    id('com.diffplug.spotless') version '8.4.0' apply false
    id('com.gradleup.shadow') version '9.3.2' apply false
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    plugins.withId('checkstyle') {
        checkstyle {
            configFile = rootProject.file('config/checkstyle/checkstyle.xml')
            configProperties = [
                'org.checkstyle.sun.suppressionfilter.config':
                    rootProject.file('config/checkstyle/checkstyle-suppressions.xml').absolutePath
            ]
        }
    }
}

// --- Release asset name contract (WBS-7.6, #386) ---
// A downstream pipeline pulls releases/latest and greps for `<module>-<version>-all.jar`
// (documentation/operations/harness-runbook.md § 2a), so the shadow jar names are a contract with a
// consumer, not an internal detail: renaming one breaks their build with no commit on their side
// (#317). Until now the only thing enforcing them was release.yml's checksum glob, which fires when
// someone cuts a release, possibly weeks after the commit that renamed the jar.
//
// This reads the name the task is configured to produce rather than building the jar, so it costs
// nothing and keeps the slow shadowJar out of `check`. The expected version comes from the root
// project, which is what -Pversion sets: comparing against each subproject's own version would let a
// module override it and move both sides of the comparison together. release.yml runs `check` with
// the release's -Pversion, so the version segment is exercised with the value a release actually
// uses, which no local build covers.
['mock-client', 'mock-game'].each { moduleName ->
    // Deliberately not guarded by plugins.withId('com.gradleup.shadow'): a guard would silently drop
    // the assertion if the module stopped applying shadow, which is one of the renames this exists to
    // catch. Without it, `shadowJar` is missing and configuration fails loudly instead.
    def expectedName = "${moduleName}-${version}-all.jar".toString()
    project(":${moduleName}") {
        // No declared inputs or outputs, so this never reports UP-TO-DATE and `check` always runs it.
        // That is deliberate: the work is one string comparison, and declaring the jar as an input
        // would wire the slow shadowJar into `check`, which is what this design avoids.
        def verifyReleaseAssetName = tasks.register('verifyReleaseAssetName') {
            group = 'verification'
            description = "Fails unless the shadow jar is named ${expectedName}, the release asset name consumers match on."
            def actualName = tasks.named('shadowJar', Jar).flatMap { it.archiveFileName }
            doLast {
                if (actualName.get() != expectedName) {
                    throw new GradleException(
                            "Release asset name contract broken (#317): shadowJar is configured to "
                                    + "produce ${actualName.get()}, expected ${expectedName}.\n"
                                    + "Downstream pipelines pull releases/latest and match on "
                                    + "<module>-<version>-all.jar (see harness-runbook.md § 2a), so this "
                                    + "rename breaks their build rather than an internal rule.\n"
                                    + "If it is intended, agree it with the consumer first, then update "
                                    + "verifyReleaseAssetName in the root build.gradle, the artifact and "
                                    + "checksum globs in .github/workflows/release.yml, and the runbook "
                                    + "together.")
                }
            }
        }
        tasks.named('check') { dependsOn verifyReleaseAssetName }
    }
}

// --- faf-ice-adapter provisioning (WBS 3.1.4.4) ---
// Fetches the pinned, headless (-nojfx) adapter jar that IceAdapterLauncher spawns. Deliberately
// NOT wired into `build`/`check` so CI stays offline; run it explicitly on a fresh checkout:
//   ./gradlew downloadIceAdapter
// The jar lands at ./faf-ice-adapter.jar — the launcher's default --ice-adapter-binary-path — and
// is gitignored. See documentation/operations/ice-adapter-setup.md.
def iceAdapterVersion = providers.gradleProperty('iceAdapterVersion').get()
def iceAdapterSha256 = providers.gradleProperty('iceAdapterSha256').get()
def iceAdapterJar = layout.projectDirectory.file('faf-ice-adapter.jar')

tasks.register('downloadIceAdapter') {
    description = "Downloads the pinned faf-ice-adapter ${iceAdapterVersion} (-nojfx) to ./faf-ice-adapter.jar."
    group = 'build setup'
    def target = iceAdapterJar.asFile
    def url = "https://github.com/FAForever/java-ice-adapter/releases/download/" +
            "${iceAdapterVersion}/faf-ice-adapter-${iceAdapterVersion}-nojfx.jar"
    inputs.property('version', iceAdapterVersion)
    inputs.property('sha256', iceAdapterSha256)
    outputs.file(iceAdapterJar)
    doLast {
        if (target.exists() && sha256Hex(target) == iceAdapterSha256) {
            logger.lifecycle("faf-ice-adapter ${iceAdapterVersion} already present (sha256 verified): ${target}")
            return
        }
        logger.lifecycle("Downloading faf-ice-adapter ${iceAdapterVersion} from ${url}")
        downloadFollowingRedirects(url, target)
        def actual = sha256Hex(target)
        if (actual != iceAdapterSha256) {
            target.delete()
            throw new GradleException(
                    "Checksum mismatch for ${url}\n  expected ${iceAdapterSha256}\n  actual   ${actual}")
        }
        logger.lifecycle("Verified faf-ice-adapter ${iceAdapterVersion} (sha256 ${actual}) -> ${target}")
    }
}

// Streams a URL to a file, following GitHub's cross-host release redirects (HttpURLConnection does
// not auto-follow all of them). Dependency-free and portable; no curl/wget required.
def downloadFollowingRedirects(String urlStr, File dest) {
    def current = new URL(urlStr)
    for (int hop = 0; hop < 5; hop++) {
        def conn = (HttpURLConnection) current.openConnection()
        conn.instanceFollowRedirects = false
        conn.connectTimeout = 30000
        conn.readTimeout = 180000
        conn.setRequestProperty('User-Agent', 'faf-test-harness-gradle')
        int code = conn.responseCode
        if (code in [301, 302, 303, 307, 308]) {
            current = new URL(current, conn.getHeaderField('Location'))
            conn.disconnect()
            continue
        }
        if (code != 200) {
            conn.disconnect()
            throw new GradleException("HTTP ${code} downloading ${urlStr}")
        }
        dest.parentFile?.mkdirs()
        dest.withOutputStream { out -> conn.inputStream.withCloseable { input -> out << input } }
        conn.disconnect()
        return
    }
    throw new GradleException("Too many redirects downloading ${urlStr}")
}

def sha256Hex(File file) {
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.eachByte(65536) { buf, len -> digest.update(buf, 0, len) }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}
